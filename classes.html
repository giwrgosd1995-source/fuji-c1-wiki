```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classes — Fuji C1 Wiki</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at top, #292015 0%, #11100e 45%, #080808 100%);

            color: #d8d1c2;

            font-family: Georgia, "Times New Roman", serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* HEADER */

        header {
            min-height: 90px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 45px;

            background: linear-gradient(
                180deg,
                #211c15,
                #0d0d0c
            );

            border-bottom: 1px solid #8b6a28;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.7);
        }

        .logo {
            color: #d8b44a;

            font-size: 30px;
            font-weight: bold;

            letter-spacing: 2px;
        }

        .subtitle {
            color: #8e8779;
            font-size: 13px;
            margin-top: 5px;
        }

        nav a {
            margin-left: 25px;

            color: #aaa294;

            font-size: 15px;

            transition: 0.2s;
        }

        nav a:hover {
            color: #e0bd55;
        }

        /* MAIN */

        main {
            max-width: 1250px;

            margin: auto;

            padding: 50px 30px 80px;
        }

        .page-title {
            text-align: center;

            margin-bottom: 40px;
        }

        .page-title h1 {
            margin: 0;

            color: #e0bd55;

            font-size: 45px;

            letter-spacing: 4px;

            text-shadow:
                0 3px 10px #000;
        }

        .page-title p {
            color: #8e8779;

            letter-spacing: 2px;
        }

        /* RACE TABS */

        .race-tabs {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 40px;
        }

        .race-tab {
            padding: 13px 24px;

            cursor: pointer;

            background:
                linear-gradient(#302719, #17140f);

            border: 1px solid #604b21;

            border-radius: 5px;

            color: #aaa294;

            font-family: inherit;

            font-size: 15px;

            transition: 0.2s;
        }

        .race-tab:hover,
        .race-tab.active {
            color: #e0bd55;

            border-color: #b18b32;

            background: #302819;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.4);
        }

        /* RACE TITLE */

        .race-title {
            text-align: center;

            color: #d7b451;

            font-size: 30px;

            margin-bottom: 30px;
        }

        /* BASE CLASSES */

        .base-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;

            margin-bottom: 45px;
        }

        .base-card {
            padding: 25px;

            background:
                linear-gradient(
                    145deg,
                    #1c1914,
                    #11110f
                );

            border: 1px solid #604b21;

            border-radius: 8px;

            text-align: center;
        }

        .base-card .icon {
            font-size: 35px;

            margin-bottom: 10px;
        }

        .base-card h3 {
            color: #d7b451;

            margin: 5px 0 8px;
        }

        .base-card p {
            color: #777166;

            margin: 0;
        }

        /* CLASS TREE */

        .tree {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));

            gap: 18px;
        }

        .class-card {
            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    #191713,
                    #0e0e0d
                );

            border: 1px solid #393124;

            border-radius: 8px;

            transition: 0.2s;
        }

        .class-card:hover {
            transform: translateY(-3px);

            border-color: #806126;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .class-level {
            display: inline-block;

            padding: 4px 8px;

            margin-bottom: 10px;

            border: 1px solid #57451f;

            border-radius: 4px;

            color: #b49343;

            font-size: 11px;

            letter-spacing: 1px;
        }

        .class-card h3 {
            margin: 5px 0;

            color: #d7b451;

            font-size: 20px;
        }

        .parent {
            color: #777166;

            font-size: 13px;
        }

        .arrow {
            color: #6d5729;

            margin: 8px 0;

            font-size: 18px;
        }

        /* FOOTER */

        footer {
            text-align: center;

            padding: 30px;

            border-top: 1px solid #29251e;

            color: #5f5a51;

            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }

            nav a {
                margin: 0 7px;
            }

            .page-title h1 {
                font-size: 35px;
            }

        }

    </style>
</head>


<body>


<header>

    <div>

        <a href="index.html">

            <div class="logo">
                ⚔ FUJI C1 WIKI
            </div>

            <div class="subtitle">
                Lineage II · Chronicle 1 · x1
            </div>

        </a>

    </div>


    <nav>

        <a href="index.html">Home</a>

        <a href="classes.html">
            Classes
        </a>

        <a href="quests.html">
            Quests
        </a>

    </nav>

</header>



<main>


    <div class="page-title">

        <h1>CLASSES</h1>

        <p>
            Chronicle 1 · Class Progression
        </p>

    </div>



    <div id="race-tabs" class="race-tabs"></div>



    <h2 id="race-title" class="race-title"></h2>



    <div
        id="base-classes"
        class="base-grid">
    </div>



    <h2 class="race-title">
        Class Progression
    </h2>



    <div
        id="class-tree"
        class="tree">
    </div>


</main>



<footer>

    Fuji C1 Wiki · Chronicle 1 · x1

</footer>



<script>

    let classData = {};

    let currentRace = "Human";


    fetch("data/classes.json")

        .then(response => {

            if (!response.ok) {
                throw new Error("Could not load classes.json");
            }

            return response.json();

        })

        .then(data => {

            classData = data;

            createRaceTabs();

            showRace("Human");

        })

        .catch(error => {

            console.error(error);

            document.getElementById("race-title").textContent =
                "Unable to load class database.";

        });



    function createRaceTabs() {

        const container =
            document.getElementById("race-tabs");


        Object.keys(classData).forEach(race => {

            const button =
                document.createElement("button");


            button.className = "race-tab";

            button.textContent = race;


            button.onclick = () => {

                showRace(race);

            };


            container.appendChild(button);

        });

    }



    function showRace(race) {

        currentRace = race;


        document
            .querySelectorAll(".race-tab")
            .forEach(button => {

                button.classList.toggle(
                    "active",
                    button.textContent === race
                );

            });


        const data =
            classData[race];


        document.getElementById("race-title")
            .textContent = race;



        /* BASE CLASSES */

        const baseContainer =
            document.getElementById("base-classes");


        baseContainer.innerHTML = "";


        data.base.forEach(base => {

            const card =
                document.createElement("div");


            card.className = "base-card";


            const icon =
                base.type === "Mystic"
                    ? "🔮"
                    : "⚔️";


            card.innerHTML = `

                <div class="icon">
                    ${icon}
                </div>

                <h3>
                    ${base.name}
                </h3>

                <p>
                    ${base.type}
                </p>

            `;


            baseContainer.appendChild(card);

        });



        /* CLASS TREE */

        const tree =
            document.getElementById("class-tree");


        tree.innerHTML = "";


        data.classes.forEach(cls => {

            const card =
                document.createElement("div");


            card.className = "class-card";


            card.innerHTML = `

                <span class="class-level">
                    LEVEL ${cls.level}
                </span>

                <h3>
                    ${cls.name}
                </h3>

                <div class="arrow">
                    ↓
                </div>

                <div class="parent">
                    From: ${cls.parent}
                </div>

            `;


            tree.appendChild(card);

        });

    }

</script>


</body>

</html>
```
