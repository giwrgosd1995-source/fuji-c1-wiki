<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classes | Fuji C1 Wiki</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #292015 0%,
                    #11100e 45%,
                    #080808 100%
                );

            color: #d8d1c2;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            min-height: 90px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 18px 45px;

            background:
                linear-gradient(
                    180deg,
                    #211c15,
                    #0d0d0c
                );

            border-bottom: 1px solid #8b6a28;

            box-shadow:
                0 5px 25px rgba(0,0,0,.7);
        }

        .logo {
            color: #e0bd55;

            font-size: 30px;

            font-weight: bold;

            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 5px;

            color: #8e8779;

            font-size: 13px;

            letter-spacing: 1px;
        }

        nav a {
            margin-left: 25px;

            color: #aaa294;

            transition: .2s;
        }

        nav a:hover {
            color: #e0bd55;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;

            padding: 45px 20px 80px;

            overflow-x: auto;
        }


        .page-title {
            text-align: center;

            margin-bottom: 35px;
        }

        .page-title h1 {
            margin: 0;

            color: #e0bd55;

            font-size: 45px;

            letter-spacing: 5px;

            text-shadow:
                0 3px 10px #000;
        }

        .page-title p {
            color: #8e8779;

            letter-spacing: 2px;
        }


        /* =========================
           RACE TABS
        ========================= */

        .race-tabs {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 35px;
        }

        .race-tab {
            padding: 12px 25px;

            cursor: pointer;

            background:
                linear-gradient(
                    #302719,
                    #17140f
                );

            border: 1px solid #604b21;

            border-radius: 5px;

            color: #aaa294;

            font-family: inherit;

            font-size: 15px;

            transition: .2s;
        }

        .race-tab:hover,
        .race-tab.active {
            color: #e0bd55;

            border-color: #b18b32;

            background: #302819;

            box-shadow:
                0 5px 15px rgba(0,0,0,.4);
        }


        /* =========================
           TREE AREA
        ========================= */

        #tree-wrapper {
            min-width: 1000px;

            display: flex;

            justify-content: center;

            padding: 20px 0 60px;
        }

        .tree {
            display: flex;

            justify-content: center;

            text-align: center;
        }


        /* =========================
           TREE UL
        ========================= */

        .tree ul {
            position: relative;

            display: flex;

            justify-content: center;

            padding-top: 45px;

            margin: 0;

            padding-left: 0;
        }


        .tree > ul {
            padding-top: 0;
        }


        .tree li {
            position: relative;

            list-style: none;

            padding: 45px 12px 0;
        }


        .tree > ul > li {
            padding-top: 0;
        }


        /* =========================
           HORIZONTAL CONNECTORS
        ========================= */

        .tree li::before,
        .tree li::after {

            content: "";

            position: absolute;

            top: 0;

            width: 50%;

            height: 45px;

            border-top: 2px solid #806126;
        }


        .tree li::before {

            right: 50%;

            border-right: 2px solid #806126;
        }


        .tree li::after {

            left: 50%;

            border-left: 2px solid #806126;
        }


        .tree > ul > li::before,
        .tree > ul > li::after {
            display: none;
        }


        /* =========================
           VERTICAL CONNECTOR
        ========================= */

        .tree li > ul::before {

            content: "";

            position: absolute;

            top: 0;

            left: 50%;

            width: 2px;

            height: 45px;

            background: #806126;
        }


        /* =========================
           FIRST / LAST CHILD
        ========================= */

        .tree li:first-child::before {
            border: 0;
        }

        .tree li:last-child::after {
            border: 0;
        }


        .tree li:only-child::before,
        .tree li:only-child::after {
            display: none;
        }


        .tree li:only-child {
            padding-top: 45px;
        }


        /* =========================
           CLASS NODE
        ========================= */

        .class-node {

            position: relative;

            display: inline-flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-width: 170px;

            min-height: 75px;

            padding: 12px 18px;

            background:
                linear-gradient(
                    145deg,
                    #252018,
                    #11100e
                );

            border: 1px solid #604b21;

            border-radius: 7px;

            box-shadow:
                0 5px 15px rgba(0,0,0,.5);

            transition:
                transform .2s,
                border-color .2s,
                box-shadow .2s;
        }


        .class-node:hover {

            transform:
                translateY(-4px);

            border-color: #d0a93f;

            box-shadow:
                0 8px 25px rgba(0,0,0,.7);
        }


        .class-name {

            color: #e0bd55;

            font-size: 17px;

            font-weight: bold;

            letter-spacing: .5px;
        }


        .class-type {

            margin-top: 5px;

            color: #777166;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        .class-level {

            position: absolute;

            top: -10px;

            right: -8px;

            padding: 3px 7px;

            background: #17140f;

            border: 1px solid #806126;

            border-radius: 4px;

            color: #b49343;

            font-size: 10px;
        }


        /* =========================
           RACE ROOT
        ========================= */

        .race-root {

            min-width: 210px;

            padding: 15px 30px;

            margin-bottom: 0;

            background:
                linear-gradient(
                    145deg,
                    #332817,
                    #18130d
                );

            border: 2px solid #a37d2c;

            border-radius: 8px;

            color: #f0c95b;

            font-size: 25px;

            font-weight: bold;

            letter-spacing: 3px;

            box-shadow:
                0 6px 20px rgba(0,0,0,.6);
        }


        /* =========================
           LOADING / ERROR
        ========================= */

        .message {

            text-align: center;

            padding: 60px;

            color: #8e8779;

            font-size: 18px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 800px) {

            header {

                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }

            nav a {

                margin: 0 8px;
            }

            .page-title h1 {

                font-size: 35px;
            }

        }

    </style>

</head>


<body>


<header>

    <div>

        <a href="index.html">

            <div class="logo">
                ⚔ FUJI C1 WIKI
            </div>

            <div class="subtitle">
                Lineage II · Chronicle 1 · x1
            </div>

        </a>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="classes.html">
            Classes
        </a>

        <a href="quests.html">
            Quests
        </a>

    </nav>

</header>



<main>


    <div class="page-title">

        <h1>CLASS TREE</h1>

        <p>
            Chronicle 1 · Class Progression
        </p>

    </div>


    <div
        id="race-tabs"
        class="race-tabs">
    </div>


    <div id="tree-wrapper">

        <div
            id="tree"
            class="tree">

            <div class="message">
                Loading classes...
            </div>

        </div>

    </div>


</main>



<script>


let classData = {};

let currentRace = "Human";


/* =========================
   LOAD JSON
========================= */

fetch("data/classes.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "Could not load classes.json"
        );

    }

    return response.json();

})


.then(data => {

    classData = data;

    createRaceTabs();

    renderRace("Human");

})


.catch(error => {

    console.error(error);

    document.getElementById("tree").innerHTML = `

        <div class="message">

            Could not load class database.

        </div>

    `;

});


/* =========================
   RACE BUTTONS
========================= */

function createRaceTabs() {

    const container =
        document.getElementById(
            "race-tabs"
        );


    container.innerHTML = "";


    Object.keys(classData)
        .forEach(race => {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "race-tab";


            button.textContent =
                race;


            button.onclick = () => {

                renderRace(race);

            };


            container.appendChild(
                button
            );

        });

}


/* =========================
   FIND CHILDREN
========================= */

function getChildren(
    race,
    parentName
) {

    return classData[race]
        .classes
        .filter(
            cls =>
                cls.parent === parentName
        );

}


/* =========================
   CREATE CLASS NODE
========================= */

function createNode(
    race,
    cls
) {

    const li =
        document.createElement("li");


    const link =
        document.createElement("a");


    link.className =
        "class-node";


    link.href =
        "class.html?name=" +
    encodeURIComponent(cls.name);


    const level =
        document.createElement("span");


    level.className =
        "class-level";


    level.textContent =
        "LV " + cls.level;


    const name =
        document.createElement("div");


    name.className =
        "class-name";


    name.textContent =
        cls.name;


    const type =
        document.createElement("div");


    type.className =
        "class-type";


    type.textContent =
        cls.level === 20
            ? "1st Class"
            : "2nd Class";


    link.appendChild(level);

    link.appendChild(name);

    link.appendChild(type);


    li.appendChild(link);


    const children =
        getChildren(
            race,
            cls.name
        );


    if (children.length > 0) {

        const ul =
            document.createElement("ul");


        children.forEach(child => {

            ul.appendChild(
                createNode(
                    race,
                    child
                )
            );

        });


        li.appendChild(ul);

    }


    return li;

}


/* =========================
   RENDER RACE
========================= */

function renderRace(race) {

    currentRace = race;


    document
        .querySelectorAll(".race-tab")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.textContent === race
            );

        });


    const tree =
        document.getElementById(
            "tree"
        );


    tree.innerHTML = "";


    const rootList =
        document.createElement("ul");


    /*
       RACE ROOT
    */

    const raceLi =
        document.createElement("li");


    raceLi.style.paddingTop = "0";


    const raceNode =
        document.createElement("div");


    raceNode.className =
        "race-root";


    raceNode.textContent =
        race.toUpperCase();


    raceLi.appendChild(
        raceNode
    );


    /*
       BASE CLASSES
    */

    const baseUl =
        document.createElement("ul");


    classData[race]
        .base
        .forEach(base => {


            const baseLi =
                document.createElement(
                    "li"
                );


            const baseNode =
                document.createElement(
                    "div"
                );


            baseNode.className =
                "class-node";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "class-name";


            name.textContent =
                base.name;


            const type =
                document.createElement(
                    "div"
                );


            type.className =
                "class-type";


            type.textContent =
                base.type;


            baseNode.appendChild(name);

            baseNode.appendChild(type);


            baseLi.appendChild(
                baseNode
            );


            /*
               FIND CLASSES THAT
               START FROM THIS BASE
            */

            const children =
                getChildren(
                    race,
                    base.name
                );


            if (children.length > 0) {

                const childUl =
                    document.createElement(
                        "ul"
                    );


                children.forEach(child => {

                    childUl.appendChild(
                        createNode(
                            race,
                            child
                        )
                    );

                });


                baseLi.appendChild(
                    childUl
                );

            }


            baseUl.appendChild(
                baseLi
            );

        });


    raceLi.appendChild(
        baseUl
    );


    rootList.appendChild(
        raceLi
    );


    tree.appendChild(
        rootList
    );

}


</script>


</body>

</html>
